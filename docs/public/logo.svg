<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5be0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.2);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Shield shape for security -->
  <path d="M100,10 L180,60 L180,110 Q180,190 100,190 Q20,190 20,110 L20,60 Z" 
        fill="url(#grad1)" 
        stroke="#1a4792" 
        stroke-width="4" />
  
  <!-- Inner lock element -->
  <rect x="70" y="80" width="60" height="40" rx="5" ry="5" fill="#ffffff" stroke="#1a4792" stroke-width="3"/>
  <rect x="85" y="95" width="30" height="20" fill="#2d5be0" stroke="#1a4792" stroke-width="2"/>
  <path d="M85,95 L85,75 L115,75 L115,95" stroke="#1a4792" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Initials "SKID" with tech font -->
  <text x="100" y="155" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="28" fill="white" text-anchor="middle" style="letter-spacing: 4px;">SKID</text>
  
  <!-- Tagline -->
  <text x="100" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.9">Security Research</text>
  
  <!-- Shine effect -->
  <path d="M100,30 L160,60 L160,100 Q160,170 100,170 Q40,170 40,100 L40,60 Z" fill="none" stroke="url(#grad2)" stroke-width="20" stroke-linecap="round"/>
</svg>